<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#121826"/>
<stop offset="100%" stop-color="#0A0E14"/>
</linearGradient>
<linearGradient id="acc2" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#3B82F6"/>
<stop offset="100%" stop-color="#60A5FA"/>
</linearGradient>
</defs>
<rect width="800" height="600" fill="url(#bg2)"/>
<rect x="0" y="0" width="800" height="48" fill="#161D2B"/>
<circle cx="28" cy="24" r="6" fill="#3B4252"/>
<circle cx="50" cy="24" r="6" fill="#3B4252"/>
<circle cx="72" cy="24" r="6" fill="#3B4252"/>
<rect x="110" y="14" width="420" height="20" rx="10" fill="#0A0E14"/>
<text x="130" y="28" font-family="Georgia" font-size="11" fill="#5B6577">student-performance-predictor.app</text>

<text x="40" y="100" font-family="Georgia" font-size="22" fill="#E8EAED" font-weight="bold">Student Performance Predictor</text>
<text x="40" y="124" font-family="Georgia" font-size="12" fill="#8B94A3">Random Forest Regressor · Real-time inference</text>

<!-- input panel -->
<rect x="40" y="150" width="280" height="300" rx="12" fill="#1E2433"/>
<text x="60" y="180" font-family="Georgia" font-size="11" fill="#8B94A3" letter-spacing="1">INPUT FEATURES</text>

<text x="60" y="215" font-family="Georgia" font-size="12" fill="#E8EAED">Study hours / week</text>
<rect x="60" y="225" width="240" height="10" rx="5" fill="#0A0E14"/>
<rect x="60" y="225" width="160" height="10" rx="5" fill="url(#acc2)"/>

<text x="60" y="260" font-family="Georgia" font-size="12" fill="#E8EAED">Attendance rate</text>
<rect x="60" y="270" width="240" height="10" rx="5" fill="#0A0E14"/>
<rect x="60" y="270" width="210" height="10" rx="5" fill="url(#acc2)"/>

<text x="60" y="305" font-family="Georgia" font-size="12" fill="#E8EAED">Previous GPA</text>
<rect x="60" y="315" width="240" height="10" rx="5" fill="#0A0E14"/>
<rect x="60" y="315" width="190" height="10" rx="5" fill="url(#acc2)"/>

<text x="60" y="350" font-family="Georgia" font-size="12" fill="#E8EAED">Sleep hours</text>
<rect x="60" y="360" width="240" height="10" rx="5" fill="#0A0E14"/>
<rect x="60" y="360" width="120" height="10" rx="5" fill="url(#acc2)"/>

<rect x="60" y="400" width="240" height="36" rx="8" fill="url(#acc2)"/>
<text x="180" y="423" font-family="Georgia" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Predict Score</text>

<!-- result panel -->
<rect x="345" y="150" width="415" height="150" rx="12" fill="#1E2433"/>
<text x="365" y="180" font-family="Georgia" font-size="11" fill="#8B94A3" letter-spacing="1">PREDICTED GPA</text>
<text x="365" y="240" font-family="Georgia" font-size="48" fill="#60A5FA" font-weight="bold">3.42</text>
<text x="365" y="270" font-family="Georgia" font-size="12" fill="#8B94A3">± 0.18 confidence interval</text>

<!-- chart -->
<rect x="345" y="320" width="415" height="130" rx="12" fill="#1E2433"/>
<text x="365" y="345" font-family="Georgia" font-size="11" fill="#8B94A3" letter-spacing="1">MODEL COMPARISON (MAE)</text>
<rect x="365" y="365" width="160" height="14" rx="4" fill="#3B4252"/>
<text x="535" y="376" font-family="Georgia" font-size="11" fill="#8B94A3">Baseline 1.43</text>
<rect x="365" y="390" width="135" height="14" rx="4" fill="url(#acc2)"/>
<text x="510" y="401" font-family="Georgia" font-size="11" fill="#60A5FA">RF Model 1.22</text>
<text x="365" y="430" font-family="Georgia" font-size="11" fill="#8B94A3">R² Score: 0.79</text>

<rect x="40" y="480" width="720" height="80" rx="12" fill="#161D2B" stroke="#1E2433"/>
<text x="65" y="515" font-family="Georgia" font-size="12" fill="#E8EAED">Linear Regression vs Random Forest comparison</text>
<text x="65" y="535" font-family="Georgia" font-size="11" fill="#8B94A3">Deployed on Streamlit · scikit-learn pipeline</text>
</svg>
