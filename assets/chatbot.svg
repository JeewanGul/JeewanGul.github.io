<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#121826"/>
<stop offset="100%" stop-color="#0A0E14"/>
</linearGradient>
<linearGradient id="acc1" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#3B82F6"/>
<stop offset="100%" stop-color="#60A5FA"/>
</linearGradient>
</defs>
<rect width="800" height="600" fill="url(#bg1)"/>
<!-- browser chrome -->
<rect x="0" y="0" width="800" height="48" fill="#161D2B"/>
<circle cx="28" cy="24" r="6" fill="#3B4252"/>
<circle cx="50" cy="24" r="6" fill="#3B4252"/>
<circle cx="72" cy="24" r="6" fill="#3B4252"/>
<rect x="110" y="14" width="420" height="20" rx="10" fill="#0A0E14"/>
<text x="130" y="28" font-family="Georgia" font-size="11" fill="#5B6577">sukkur-iba-faq-bot.streamlit.app</text>

<!-- chat header -->
<rect x="40" y="80" width="720" height="60" rx="12" fill="#1E2433"/>
<circle cx="75" cy="110" r="16" fill="url(#acc1)"/>
<text x="75" y="115" font-family="Georgia" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">AI</text>
<text x="105" y="105" font-family="Georgia" font-size="16" fill="#E8EAED" font-weight="600">Sukkur IBA FAQ Assistant</text>
<text x="105" y="124" font-family="Georgia" font-size="11" fill="#8B94A3">TF-IDF + Logistic Regression · Online</text>

<!-- chat bubbles -->
<rect x="380" y="165" width="380" height="44" rx="16" fill="url(#acc1)"/>
<text x="400" y="192" font-family="Georgia" font-size="13" fill="#fff">What's the last date to submit my fee voucher?</text>

<rect x="40" y="225" width="420" height="68" rx="16" fill="#1E2433"/>
<text x="60" y="250" font-family="Georgia" font-size="13" fill="#E8EAED">Fee vouchers must be submitted within 10</text>
<text x="60" y="268" font-family="Georgia" font-size="13" fill="#E8EAED">working days of issuance. Late submissions</text>
<text x="60" y="286" font-family="Georgia" font-size="13" fill="#E8EAED">incur a 5% surcharge per week.</text>

<rect x="380" y="310" width="380" height="44" rx="16" fill="url(#acc1)"/>
<text x="400" y="337" font-family="Georgia" font-size="13" fill="#fff">How do I apply for a hostel room?</text>

<rect x="40" y="370" width="460" height="48" rx="16" fill="#1E2433"/>
<text x="60" y="399" font-family="Georgia" font-size="13" fill="#E8EAED">Apply via the Student Portal → Hostel tab.</text>

<!-- metrics bar -->
<rect x="40" y="450" width="720" height="110" rx="12" fill="#161D2B" stroke="#1E2433" stroke-width="1"/>
<text x="65" y="480" font-family="Georgia" font-size="11" fill="#8B94A3" letter-spacing="1">MODEL PERFORMANCE</text>

<text x="65" y="525" font-family="Georgia" font-size="28" fill="#60A5FA" font-weight="bold">91.4%</text>
<text x="65" y="545" font-family="Georgia" font-size="11" fill="#8B94A3">Accuracy</text>

<text x="245" y="525" font-family="Georgia" font-size="28" fill="#60A5FA" font-weight="bold">0.89</text>
<text x="245" y="545" font-family="Georgia" font-size="11" fill="#8B94A3">F1 Score</text>

<text x="405" y="525" font-family="Georgia" font-size="28" fill="#60A5FA" font-weight="bold">0.88</text>
<text x="405" y="545" font-family="Georgia" font-size="11" fill="#8B94A3">Precision</text>

<text x="565" y="525" font-family="Georgia" font-size="28" fill="#60A5FA" font-weight="bold">3</text>
<text x="565" y="545" font-family="Georgia" font-size="11" fill="#8B94A3">Team members</text>
</svg>
